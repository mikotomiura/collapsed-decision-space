name: compendium

# B2 (2026-09-25) で出荷した run records を、凍結範囲の外側から検査する workflow。
#
# held-out 検査の script と heldout-stay.yml は凍結済 (heldout_stay_check.py の FROZEN_PATHS) で、
# heldout-stay.yml は --self-test を records なしで呼ぶ。そのため PC-records は SKIPPED と表示され、
# その理由の文言 ("it is not shipped") も凍結 bytes なので変えられない。ここでは凍結 script を
# 変えずに呼び、出荷した data/completed/bank_records.jsonl を渡して PC-records を PASS させる。
#
#   check_pc_records.py        : 凍結 self-test を records なし / ありで 2 回走らせ、PC-records が
#                                SKIPPED → PASS に変わり、**他の全項目の行が 2 回で同一**であることを要求
#   recompute_verdict.py --self-test : 3 verdict の再計算 (repro.sh step 5) の入力側変異。
#                                zone を 1 つ動かす / 1 行落とすと不一致になり、無変更の対照は一致する
#   check_pdf_text.py --self-test : 頁の判定 (page_problems) を合成の頁列で試す。構造の検査
#                                (References と最初の付録の見出しが 1 回ずつ・順序・本文の図が References
#                                より前) は両 build、頁の上限は anonymous の build だけに掛かる
#                                (2026-10-04)。例ごとに、どちらの build として読むかと期待の診断文を
#                                照合する。PDF を作る submission-pdf.yml は手動実行だけなので、判定
#                                そのものはここで push・PR ごとに両 OS で固定する
#   render_references.py --check : main.md の References が manuscript/refs.json から描画したものと
#                                一致することを要求する。年を動かす・著者を落とす・項目を消すの 3 変異が、
#                                それぞれ触った項目の名で報告されることも毎回確かめる
#   check_docx_text.py --self-test : APA 7 の .docx の読み戻しの検査を、合成の原稿と手書きの合成の
#                                .docx で試す (pandoc は要らない、2026-10-04)。変異なしの対照が通り、
#                                段落を落とす・重ねる・数字や記号を変える・図の画像を落とす / 入れ替える・
#                                書誌を落とす / 年や著者を変える・引用先を替える・表のセル境界を動かす・
#                                英国式の綴り・AI 開示を変える / 移動元に残す・変換の記録を変える等の
#                                19 の変異が、それぞれ期待どおりの診断の組 (検査名と位置) で落ちることを
#                                要求する。.docx を作る apa-docx.yml は手動実行だけなので、判定そのものは
#                                ここで push・PR ごとに両 OS で固定する
#
# 前者の出力は両 OS で byte 一致を compare job で要求する。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compendium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compendium:
    name: compendium checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # 凍結 self-test を heldout-stay.yml と同じ checkout 条件で走らせる
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Pin the environment from the lockfile
        shell: bash
        run: uv sync --frozen --no-install-project --project env

      - name: PC-records with the shipped completed-run records
        shell: bash
        run: uv run --project env --no-sync python analysis/scripts/check_pc_records.py --out build/compendium/pc-records.txt

      - name: Verdict recomputation, input mutations
        shell: bash
        run: uv run --project env --no-sync python analysis/scripts/recompute_verdict.py --self-test

      - name: PDF page checks, synthetic pages, as each build reads them
        shell: bash
        run: uv run --project env --no-sync python analysis/scripts/check_pdf_text.py --self-test

      - name: PDF identity scan, cited DOIs broken by the layout
        shell: bash
        run: uv run --project env --no-sync python analysis/scripts/check_pdf_identity.py --self-test

      - name: References rendered from manuscript/refs.json
        shell: bash
        run: uv run --project env --no-sync python analysis/scripts/render_references.py --check

      - name: APA .docx read-back, a synthetic .docx and its mutations
        shell: bash
        run: uv run --project env --no-sync python analysis/scripts/check_docx_text.py --self-test

      - name: Upload the PC-records output
        uses: actions/upload-artifact@v4
        with:
          name: compendium-${{ matrix.os }}
          path: build/compendium/
          if-no-files-found: error

  compare:
    name: compendium output byte-identical across OS
    needs: compendium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download ubuntu output
        uses: actions/download-artifact@v4
        with:
          name: compendium-ubuntu-latest
          path: from-ubuntu

      - name: Download windows output
        uses: actions/download-artifact@v4
        with:
          name: compendium-windows-latest
          path: from-windows

      - name: Compare byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          (cd from-ubuntu && sha256sum ./*)
          (cd from-windows && sha256sum ./*)
          diff -r from-ubuntu from-windows
          echo "OK: PC-records の出力は両 OS で byte 一致した"
