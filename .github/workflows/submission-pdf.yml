name: Submission PDF

# Build the TMLR submission PDF from `manuscript/main.md`, and read it back.
#
# **Manual only.** Producing a PDF is not part of reproducing the study, and `repro.sh` deliberately
# needs nothing but `uv`. Adding a LaTeX toolchain to the reproduction path would make the central
# claim of this repository -- that one command reproduces the completed studies -- harder to honour,
# not easier.
#
# **There is no second manuscript.** The PDF is derived from `manuscript/main.md`, which is the only
# text the claim-boundary check, the abstract-consistency check and the character-level number check
# read. `make_pdf_source.py` performs a mechanical transformation into the official TMLR style
# (`manuscript/tmlr/`, vendored byte for byte), and `make_figures.py` draws the three figures from the
# shipped data.
#
# The build is not trusted. pdflatex stops on a character it has no definition for, which is why it
# replaced XeTeX (which sets nothing and carries on), but a table can still overprint its neighbour, a
# figure can lose a number and a citation can go unresolved without the build failing. So the PDF is
# read back with `pdftotext`, twice: in reading order for the text, and in content-stream order for
# the figures, whose rows are emitted as consecutive runs so that the check does not depend on how an
# extractor lays out columns (xpdf and poppler do that differently).

on:
  workflow_dispatch:
    inputs:
      anonymous:
        description: >-
          Build the anonymous submission PDF and the anonymous supplement instead of the named
          preprint, and read the PDF back to check that nothing in it identifies the author.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pdf:
    name: build and check the TMLR PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      # pandoc is pinned by version and by the digest of its release package, so that a change of
      # converter shows up as a change of this file rather than as a quiet change of the page.
      PANDOC_VERSION: "3.5"
      PANDOC_DEB_SHA256: "4f41d817d262ef3d17953a3e6e0fefddb971aa4f2f121544a9a86db449d945e1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build the anonymous bundle, and take the manuscript from it
        # `make_anonymous_bundle.py` refuses to run on a dirty tree, produces the redacted
        # manuscript and the deterministic supplement zip, and asserts that every sealed file is
        # byte-identical to the public copy. Swapping the redacted files in keeps the rest of the
        # workflow identical for both builds -- one pipeline, so the anonymous PDF cannot drift from
        # the named one except by the redactions.
        if: inputs.anonymous
        run: |
          set -eux
          uv run --project env --no-sync python analysis/scripts/make_anonymous_bundle.py \
            --out build/anonymous --zip
          for f in manuscript/main.md analysis/scripts/make_pdf_source.py analysis/scripts/check_pdf_text.py; do
            cp "build/anonymous/$f" "$f"
          done

      - name: Install pandoc, TeX Live and poppler
        run: |
          set -eux
          curl -sSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_DEB_SHA256}  /tmp/pandoc.deb" | sha256sum -c -
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1 | grep -qx "pandoc ${PANDOC_VERSION}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures lmodern poppler-utils
          # What tmlr.sty and the template load, asserted where it is installed rather than
          # discovered in the middle of a build.
          for sty in lmodern eso-pic natbib seqsplit footnotehyper tikz amsmath amssymb longtable booktabs hyperref; do
            kpsewhich "$sty.sty"
          done
          kpsewhich glyphtounicode.tex

      - name: Generate the pandoc source, the bibliography and the figures
        run: |
          set -eux
          python3 analysis/scripts/make_pdf_source.py --out-dir build/pdf ${{ inputs.anonymous && '--anonymous' || '' }}
          python3 analysis/scripts/make_figures.py --out-dir build/pdf
          python3 analysis/scripts/make_figures.py --out-dir build/pdf --check

      - name: Build the PDF
        # The date the PDF records is the date of the commit, not of the build, so that two builds
        # of one commit agree on it.
        working-directory: build/pdf
        run: |
          set -eux
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export FORCE_SOURCE_DATE=1
          pandoc -d ../../manuscript/tmlr/pandoc.yaml -d pandoc-vars.yaml paper-source.md -o paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper
          bibtex paper
          pdflatex -interaction=nonstopmode -halt-on-error paper
          pdflatex -interaction=nonstopmode -halt-on-error paper
          # A citation or cross-reference that did not resolve prints as "?" and does not fail
          # the build; neither does a BibTeX warning about an entry it could not format.
          # Written as `if`, not as `! grep`: bash exempts a command negated with `!` from
          # `set -e`, so `! grep` that matched would not have stopped the step (TASK-POST review).
          if grep -E "Citation .* undefined|Reference .* undefined|There were undefined" paper.log; then exit 1; fi
          if grep -E "^Warning--" paper.blg; then exit 1; fi
          ls -l paper.pdf

      - name: Read the PDF back
        working-directory: build/pdf
        run: |
          set -eux
          pdftotext -enc UTF-8 paper.pdf paper.txt
          pdftotext -enc UTF-8 -raw paper.pdf paper-raw.txt
          wc -c paper.txt paper-raw.txt
          pdfinfo paper.pdf | sed -n '1,14p'

      - name: Check what the PDF actually contains
        # Required phrases, the page budget, the first-page footnote, every figure's numbers row by
        # row on its own page, the column headers of the widest tables, the characters at risk of
        # silent loss, and the quantities read from the frozen inputs by key.
        run: |
          python3 analysis/scripts/check_pdf_text.py build/pdf/paper.txt \
            --raw build/pdf/paper-raw.txt ${{ inputs.anonymous && '--anonymous' || '' }}

      - name: Check that nothing in the anonymous PDF identifies the author
        # Reads the information dictionary, any XMP packet, every link annotation and every
        # inflated stream, and the page. The upstream project's name and the title of the author's
        # prior preprint fail here as well, though the supplement has to keep the former.
        if: inputs.anonymous
        run: |
          uv run --project env --no-sync python analysis/scripts/check_pdf_identity.py \
            build/pdf/paper.pdf --text build/pdf/paper.txt

      - name: Check the PDF against the claim boundary
        # The PDF is published in its own right, so it is a claim surface too. The patterns come
        # from `manuscript/CLAIM-BOUNDARY.md` -- one SSOT, applied to the derived artefact as well
        # as to the source. The check compares the abstract with CITATION.cff and needs PyYAML;
        # the locked environment is not synced here (it would install torch), so PyYAML is
        # supplied at the version `env/uv.lock` pins. The first run of this workflow used
        # `--no-sync` alone and failed on the import.
        run: |
          uv run --no-project --with "pyyaml==6.0.3" python analysis/scripts/check_claim_boundary.py \
            --extra-target build/pdf/paper.txt

      - name: Upload the PDF, and for the anonymous build the supplement
        # `always()` so that a failing check still hands over the PDF and the text it was read
        # from: when a check reports something missing from the page, the next question is what
        # the page actually says.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmlr-${{ inputs.anonymous && 'anonymous' || 'named' }}-${{ github.sha }}
          path: |
            build/pdf/paper.pdf
            build/pdf/paper.txt
            build/pdf/paper-raw.txt
            build/pdf/paper.log
            build/anonymous.zip
            build/anonymous/anonymisation-report.json
          if-no-files-found: warn
          retention-days: 90
